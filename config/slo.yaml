service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Baseline CP0 có latency P95 khoảng 2392 ms và 10/10 request retrieval thành công,
    nên ngưỡng 3000 ms để có khoảng dự phòng 608 ms. Mẫu 10 request còn nhỏ;
    cần theo dõi lại khi tải tăng. Trong cửa sổ 28 ngày, good request là response_sent
    với latency_ms <= 3000; request lỗi, không có response_sent hoặc chậm hơn 3000 ms
    đều tiêu hao error budget. Với 10000 request, 0.5% = tối đa 50 request không đạt;
    với 1000 request là tối đa 5 request.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
